<!doctype html>
<!--
  Dev-only diorama bench (never built: vite builds index.html only).
  /qa/3d.html?id=_calibration&w=1920&h=1080[&still][&nopost]
  Renders one scene at exactly w x h device pixels through the same camera fit
  the Cycles posters used, for parity boards, toy scripts and timing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3D bench</title>
    <style>
      html, body { margin: 0; background: #09090b; color: #a1a1aa; font: 12px/1.4 'Geist Mono', monospace; }
      #media { position: relative; overflow: hidden; background: #09090b; }
      #media > canvas.media-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud { position: fixed; right: 8px; bottom: 8px; padding: 4px 8px; background: rgb(0 0 0 / 0.6); border-radius: 6px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="media"></div>
    <div id="hud"></div>
    <script type="module" src="/src/three/qa.js"></script>
  </body>
</html>
